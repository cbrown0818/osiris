server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static OSIRIS interface.
    location / {
        try_files $uri $uri/ =404;
    }

    # Normalize the API root.
    location = /api {
        return 308 /api/;
    }

    # Same-origin browser API gateway.
    #
    # The trailing slash on proxy_pass intentionally strips /api/
    # before forwarding to FastAPI.
    #
    # Example:
    #   /api/system/status
    # becomes:
    #   http://osiris-api:8000/system/status
    location /api/ {
        proxy_pass http://osiris-api:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve the browser's OSIRIS bearer token.
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Suitable for streaming/long-running AI responses.
        proxy_buffering off;
    }
}
